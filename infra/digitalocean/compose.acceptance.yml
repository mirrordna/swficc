services:
  swfi2-key-store-init:
    image: alpine:3.21
    restart: "no"
    command: ["sh", "-c", "mkdir -p /app/product-state && chown -R 10002:10002 /app/product-state"]
    volumes:
      - api_product_key_store:/app/product-state

  swfipn-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  swfi2-backend:
    build:
      context: ${SWFI2_BACKEND_CONTEXT:-../SWFI2.0-final}
      dockerfile: Dockerfile
    image: swfipn/swfi2-backend:acceptance
    restart: unless-stopped
    depends_on:
      swfi2-key-store-init:
        condition: service_completed_successfully
      swfipn-redis:
        condition: service_healthy
    env_file:
      - ${SWFI2_BACKEND_ENV:-./.env.swfi2-backend}
    environment:
      SWFI2_HOST: 0.0.0.0
      SWFI2_PORT: 8362
      SWFI2_ALLOW_UNAUTH_LOCAL: "0"
      SWFI2_STRICT_BOOT: ${SWFI2_STRICT_BOOT:-0}
      SWFI2_PRODUCT_API_KEY_STORE_PATH: /app/product-state/api-product-keys.json
      SWFI2_ADMIN_STORE_PATH: /app/product-state/admin-governance.json
      SWFI2_SAVED_SEARCH_STORE_PATH: /app/product-state/saved-searches.json
      SWFI2_ALERT_STORE_PATH: /app/product-state/alerts.json
      SWFI2_ALERT_WEBHOOK_ALLOWED_HOSTS: ${SWFI2_ALERT_WEBHOOK_ALLOWED_HOSTS:-swfipn.activemirror.ai,api.swfi.com}
      SWFI2_REDIS_URL: redis://swfipn-redis:6379/0
      SWFI2_REDIS_CACHE_PREFIX: swfipn
    expose:
      - "8362"
    volumes:
      - api_product_key_store:/app/product-state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8362/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  swfipn-web:
    build:
      context: ${SWFIPN_FRONTEND_CONTEXT:-../swfi-dashboard}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SWFI_BACKEND_URL: same-origin
        NEXT_PUBLIC_BACKEND_URL: same-origin
        SWFIPN_ASSET_VERSION: ${SWFIPN_ASSET_VERSION:-}
        SWFIPN_GIT_SHA: ${SWFIPN_GIT_SHA:-unknown}
        SWFIPN_GIT_DIRTY: ${SWFIPN_GIT_DIRTY:-0}
    image: swfipn/web:acceptance
    restart: unless-stopped
    depends_on:
      swfi2-backend:
        condition: service_healthy
    env_file:
      - ${SWFIPN_WEB_ENV:-./.env.swfipn-web}
    environment:
      SWFIPN_HOST: 0.0.0.0
      SWFIPN_PORT: 8353
      SWFIPN_ROOT: /app/out
      SWFIPN_BACKEND: http://swfi2-backend:8362
      SWFIPN_BACKEND_TIMEOUT: "75"
      SWFIPN_BACKEND_TOKEN_USE_KEYCHAIN: "0"
      SWFIPN_REQUIRE_RECORD_AUTH: "0"
    expose:
      - "8353"
    healthcheck:
      test: ["CMD", "python", "/app/swfipn-container-healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      swfipn-web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SWFIPN_DOMAIN: ${SWFIPN_DOMAIN:-swfipn.activemirror.ai}
      SWFIPN_API_DOMAIN: ${SWFIPN_API_DOMAIN:-api.swfi.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@activemirror.ai}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
    name: swfipn_acceptance_caddy_data
  caddy_config:
    name: swfipn_acceptance_caddy_config
  api_product_key_store:
    name: swfipn_acceptance_api_product_key_store
  redis_data:
    name: swfipn_acceptance_redis_data
